<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ウタサーチ</title>
<style>
:root{--bg:#fff8da;--ink:#222;--accent:#ffc928;--card:#fff;--muted:#707070;--line:#e9dfb8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff6c9,#fffdf4);color:var(--ink)}header{padding:20px 18px 12px;position:sticky;top:0;background:rgba(255,248,218,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}.brand{font-size:24px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:4px}main{max-width:760px;margin:auto;padding:16px}.notice{background:#fff3ad;border:1px solid #efd572;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px}.controls{display:grid;gap:10px;background:var(--card);padding:14px;border-radius:18px;box-shadow:0 10px 30px rgba(80,60,0,.08)}label{font-size:12px;font-weight:700;color:#555}input,select,button{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:15px}button{background:var(--accent);border:none;font-weight:900;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.results{display:grid;gap:12px;margin-top:16px}.card{background:#fff;border:1px solid #eee1b3;border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(70,55,0,.06)}.name{font-weight:900;font-size:17px}.meta{font-size:12px;color:#666;margin-top:4px}.price{font-size:26px;font-weight:900;margin-top:12px}.price small{font-size:12px;color:#777}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:11px;background:#f7f2df;padding:5px 8px;border-radius:999px}.empty{padding:28px;text-align:center;color:#777}.footer{font-size:11px;color:#777;margin:24px 4px 10px;line-height:1.6}@media(max-width:560px){.row{grid-template-columns:1fr}.brand{font-size:22px}}
</style>
</head>
<body>
<header><div class="brand">🎤 ウタサーチ</div><div class="sub">カラオケ料金を「実支払総額」で比較</div></header>
<main>
<div class="notice">緊急復旧版です。Cloudflare公開先の復旧中のため、まず画面を開ける状態に戻しています。料金は確認済みデータのみ表示します。</div>
<section class="controls">
<div><label>エリア / 駅名</label><input id="area" value="我孫子" placeholder="例：我孫子、柏、新宿"></div>
<div class="row"><div><label>利用時間</label><select id="duration"><option value="60">1時間</option><option value="120" selected>2時間</option><option value="180">3時間</option><option value="300">5時間</option></select></div><div><label>人数</label><select id="people"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div></div>
<div class="row"><div><label>属性</label><select id="profile"><option value="general">一般</option><option value="student">学生</option></select></div><div><label>開始時刻</label><input id="time" type="time"></div></div>
<button id="search">料金を比較</button>
</section>
<div id="results" class="results"></div>
<div class="footer">この公開版は復旧用の軽量版です。Cloudflare/D1/GPS/全国店舗探索/OCRバックエンドは本公開先復旧後に順次戻します。</div>
</main>
<script>
const stores=[
{name:'カラオケBanBan 我孫子店',area:'我孫子',chain:'BanBan',general:220,student:160,drink:450,tags:['確認済み料金','DAM / JOYSOUND']},
{name:'カラオケまねきねこ 我孫子店',area:'我孫子',chain:'まねきねこ',general:260,student:180,drink:440,tags:['確認済み料金','ワンドリンク制']},
{name:'カラオケBanBan 柏駅前店',area:'柏',chain:'BanBan',general:240,student:170,drink:450,tags:['確認済み料金']},
{name:'カラオケ館 柏駅前店',area:'柏',chain:'カラオケ館',general:330,student:250,drink:500,tags:['参考料金','DAM / JOYSOUND']}
];
function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}document.querySelector('#time').value=nowTime();
function render(){const area=document.querySelector('#area').value.trim();const duration=+document.querySelector('#duration').value;const people=+document.querySelector('#people').value;const profile=document.querySelector('#profile').value;const blocks=Math.ceil(duration/30);let rows=stores.filter(s=>!area||s.area.includes(area)||s.name.includes(area));rows=rows.map(s=>{const unit=s[profile]??s.general;const room=unit*blocks*people;const drink=s.drink*people;return {...s,total:room+drink,room,drink}}).sort((a,b)=>a.total-b.total);const root=document.querySelector('#results');if(!rows.length){root.innerHTML='<div class="empty">該当する復旧版データがありません。現在は我孫子・柏の確認済みデータを優先表示しています。</div>';return}root.innerHTML=rows.map((s,i)=>`<article class="card"><div class="name">${i===0?'🥇 ':''}${s.name}</div><div class="meta">${s.area} ・ ${duration}分 ・ ${people}名 ・ ${profile==='student'?'学生':'一般'}</div><div class="price">約 ¥${s.total.toLocaleString()} <small>合計</small></div><div class="meta">室料 ¥${s.room.toLocaleString()} + 必須料金 ¥${s.drink.toLocaleString()}</div><div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></article>`).join('')}
document.querySelector('#search').addEventListener('click',render);render();
</script>
</body>
</html>
